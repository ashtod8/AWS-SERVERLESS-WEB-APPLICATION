<html>
	<head>
		<script>
			function myfunction() {
				var xhttp = new XMLHttpRequest();
				xhttp.onreadystatechange = function() {
					if (this.readyState == 4 && this.status == 200) {
					document.getElementById("my-demo").innerHTML = this.responseText;
					}
				};
				xhttp.open("GET", "https://kyuh14izm5.execute-api.ap-south-1.amazonaws.com/default/AWSLambdaFunction", true);
				xhttp.send();
			}
		</script>
	</head>
	<body bgcolor="#d7bde2">
		<div align="center">
			<br>
			<br>
			<br>
			<br>
			<h1><span id="my-demo">Serverless Web-Application</span></h1>
			<button onclick="myfunction()">Description</button>
			<br>
		</div>
	</body>
</html>
